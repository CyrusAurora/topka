# A release, from a pushed tag vX.Y.Z or a pre-release tag vX.Y.Z-<label> (docs/release.md): checks the
# tag against package.json, builds the CycloneDX and SPDX SBOMs and a source archive, builds the
# container image for linux/amd64 and linux/arm64 and pushes it to ghcr.io, writes SHA256SUMS over
# every attachment (and the image digest), has provenance generated and signed for all of it by an
# isolated builder, signs and attests the image, verifies everything as a user would, and publishes
# the GitHub release with the CHANGELOG section as its notes.
#
# SLSA Build Level 3 (docs/release.md, "Provenance"): the `build` job has no OIDC token (no
# id-token permission), so nothing that runs during the build (npm install scripts, the Dockerfile)
# can sign anything. Provenance is generated by slsa-framework/slsa-github-generator's reusable
# workflows (generic: the release files; container: the image) in their own jobs on fresh hosted
# runners, from the digests the build job reports, and signed keylessly with an OIDC identity that
# names the generator's workflow, not this one: a build step cannot produce a provenance that
# slsa-verifier accepts. The generator is referenced by release tag, not commit SHA, because it
# checks its own ref; it is the one action here not pinned to a SHA.
#
# Also, in a separate `attest` job that runs no repository code: cosign signs the image digest (a
# Sigstore certificate naming this workflow and the tag) and actions/attest writes GitHub artifact
# attestations (provenance and CycloneDX SBOM) for `gh attestation verify`. These are a convenience
# signed by this repository's own workflow; the L3 claim rests on the generator's provenance.
#
# A pull request that touches this file or the Dockerfile runs the build job without publishing: the
# image goes to a throwaway registry on the runner, and cosign signs and verifies it there with a key
# made for the run and no transparency log (nothing of a private repository reaches Sigstore's public
# logs). Provenance and attestations cannot be rehearsed that way: they need a public repository, so
# they run for real only on a tag pushed to it (a throwaway pre-release tag is the rehearsal).
name: Release

on:
  push:
    tags: ["v*"]
  pull_request:
    paths: [".github/workflows/release.yml", "Dockerfile", ".dockerignore", "package-lock.json"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write # push the image to ghcr.io (no id-token: nothing in this job can sign)
    outputs:
      version: ${{ steps.meta.outputs.version }}
      release: ${{ steps.meta.outputs.release }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      image: ${{ steps.meta.outputs.image }}
      publish: ${{ steps.meta.outputs.publish }}
      digest: ${{ steps.build.outputs.digest }}
      subjects: ${{ steps.sums.outputs.subjects }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Version, image name, publish or not
        id: meta
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p 'require("./package.json").version')
          publish=false
          release=$version
          prerelease=false
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            # vX.Y.Z is a release; vX.Y.Z-<label> (letters, digits, dots, hyphens) is a pre-release of it.
            release=${GITHUB_REF_NAME#v}
            if [ "$release" != "$version" ]; then
              [[ "$release" =~ ^${version//./\\.}-[0-9A-Za-z.-]+$ ]] || { echo "::error::tag $GITHUB_REF_NAME does not match package.json version $version (or $version-<label>)"; exit 1; }
              prerelease=true
            fi
            [ "$(gh api "repos/$GITHUB_REPOSITORY" --jq .private)" = false ] && publish=true
          fi
          # A dry run pushes to the throwaway registry started below, never to ghcr.io.
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          [ "$publish" = true ] || image="localhost:5000/topka"
          # A pre-release image gets only its own tag; :latest and :X.Y.Z stay on the last release.
          tags="$image:$release"
          [ "$prerelease" = true ] || tags="$tags,$image:latest"
          {
            echo "version=$version"
            echo "release=$release"
            echo "prerelease=$prerelease"
            echo "image=$image"
            echo "tags=$tags"
            echo "publish=$publish"
          } >> "$GITHUB_OUTPUT"
          echo "version $version, release $release, prerelease=$prerelease, publish=$publish"

      - name: Install
        run: npm ci --no-audit --no-fund
      - name: SBOMs and source archive
        env:
          VERSION: ${{ steps.meta.outputs.release }}
        run: |
          mkdir -p "$RUNNER_TEMP/dist"
          npm sbom --sbom-format=cyclonedx > "$RUNNER_TEMP/dist/topka-$VERSION.cyclonedx.json"
          npm sbom --sbom-format=spdx > "$RUNNER_TEMP/dist/topka-$VERSION.spdx.json"
          node -e 'const s=require(process.argv[1]); if (!s.components?.length) throw new Error("empty SBOM"); console.log(s.bomFormat, s.components.length, "components")' "$RUNNER_TEMP/dist/topka-$VERSION.cyclonedx.json"
          git archive --format=tar.gz --prefix="topka-$VERSION/" -o "$RUNNER_TEMP/dist/topka-$VERSION.tar.gz" HEAD

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64
      - name: Throwaway registry (dry run)
        if: steps.meta.outputs.publish != 'true'
        run: docker run -d --name dry-run-registry -p 127.0.0.1:5000:5000 registry:3@sha256:38907510915c3f1604c7e83d6ab602ab3020d092f73bdaed8696773693ff768c
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          # host network, so a dry run's builder reaches localhost:5000 (plain HTTP, only that address)
          driver-opts: network=host
          buildkitd-config-inline: |
            [registry."localhost:5000"]
              http = true
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        if: steps.meta.outputs.publish == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Image (linux/amd64 + linux/arm64)
        id: build
        # A healthy build takes about 5 minutes; fail long before the job limit if one hangs.
        timeout-minutes: 30
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false # the build record artifact carries commit authors and messages
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true # to ghcr.io when publishing, else to the throwaway registry
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=MIT

      - name: Checksums
        id: sums
        env:
          VERSION: ${{ steps.meta.outputs.release }}
          IMAGE: ${{ steps.meta.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
          PUBLISH: ${{ steps.meta.outputs.publish }}
        run: |
          cd "$RUNNER_TEMP/dist"
          [ -n "$DIGEST" ] || { echo "::error::the build reported no image digest"; exit 1; }
          if [ "$PUBLISH" = true ]; then echo "$IMAGE:$VERSION@$DIGEST" > "topka-$VERSION.image.txt"; fi
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS
          sha256sum -c SHA256SUMS
          # The provenance subjects: exactly these files and digests, as the generic generator wants them.
          echo "subjects=$(base64 -w0 SHA256SUMS)" >> "$GITHUB_OUTPUT"

      - name: Sign the image with a run-local key (dry run only)
        if: steps.meta.outputs.publish != 'true'
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Sign and verify in the throwaway registry (dry run only)
        if: steps.meta.outputs.publish != 'true'
        env:
          REF: ${{ steps.meta.outputs.image }}@${{ steps.build.outputs.digest }}
        run: |
          cd "$RUNNER_TEMP"
          COSIGN_PASSWORD= cosign generate-key-pair
          cosign signing-config create --out offline-signing.json # no Fulcio, no Rekor: nothing leaves the runner
          COSIGN_PASSWORD= cosign sign --yes --key cosign.key --signing-config offline-signing.json "$REF"
          cosign verify --key cosign.pub --insecure-ignore-tlog=true "$REF" > /dev/null
          # The check must be able to fail: a key that did not sign is refused.
          mkdir other && (cd other && COSIGN_PASSWORD= cosign generate-key-pair > /dev/null)
          if cosign verify --key other/cosign.pub --insecure-ignore-tlog=true "$REF" > /dev/null 2>&1; then echo "::error::a foreign key verified"; exit 1; fi
          rm -rf cosign.key cosign.pub other
          echo "signed and verified $REF"

      - name: Release notes from CHANGELOG.md
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          RELEASE: ${{ steps.meta.outputs.release }}
          PRERELEASE: ${{ steps.meta.outputs.prerelease }}
        run: |
          awk -v h="## [$RELEASE]" 'index($0, h) == 1 {f=1; next} f && /^## /{exit} f' CHANGELOG.md > "$RUNNER_TEMP/dist/notes.md"
          if [ ! -s "$RUNNER_TEMP/dist/notes.md" ]; then
            [ "$PRERELEASE" = true ] || { echo "::error::CHANGELOG.md has no '## [$RELEASE]' section"; exit 1; }
            printf 'Pre-release of %s for testing the release pipeline; not a supported version (see SECURITY.md).\n' "$VERSION" > "$RUNNER_TEMP/dist/notes.md"
          fi
          wc -l "$RUNNER_TEMP/dist/notes.md"
      - name: Keep the release files for the next jobs
        if: steps.meta.outputs.publish == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files
          path: ${{ runner.temp }}/dist/
          if-no-files-found: error
          retention-days: 7

  # SLSA provenance for the release files, by the isolated generic generator (see the header).
  provenance-files:
    needs: build
    if: needs.build.outputs.publish == 'true'
    permissions:
      actions: read # the generator reads this run's workflow
      id-token: write # the generator's own OIDC identity signs the provenance
      contents: write # declared by the generator's (unused here) release upload job
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: ${{ needs.build.outputs.subjects }}
      provenance-name: topka-${{ needs.build.outputs.release }}.intoto.jsonl

  # SLSA provenance for the image, by the isolated container generator; pushed to ghcr.io next to it.
  provenance-image:
    needs: build
    if: needs.build.outputs.publish == 'true'
    permissions:
      actions: read
      id-token: write
      packages: write # the generator pushes the signed provenance to ghcr.io
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_container_slsa3.yml@v2.1.0
    with:
      image: ${{ needs.build.outputs.image }}
      digest: ${{ needs.build.outputs.digest }}
      registry-username: ${{ github.actor }}
    secrets:
      registry-password: ${{ secrets.GITHUB_TOKEN }}

  # The cosign signature and GitHub's own attestations. No checkout, no repository code: only pinned
  # actions and the files the build job reported.
  attest:
    needs: build
    if: needs.build.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write # push the signature and the attestations next to the image
      id-token: write # the OIDC token Sigstore certifies (cosign and actions/attest)
      attestations: write # store the attestations on the repository
    env:
      RELEASE: ${{ needs.build.outputs.release }}
      IMAGE: ${{ needs.build.outputs.image }}
      DIGEST: ${{ needs.build.outputs.digest }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: dist
      - name: The files are the ones the build job hashed
        env:
          SUBJECTS: ${{ needs.build.outputs.subjects }}
        run: cd dist && sha256sum -c SHA256SUMS && [ "$(base64 -w0 SHA256SUMS)" = "$SUBJECTS" ]
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Sign the image (keyless)
        env:
          IDENTITY: ${{ github.server_url }}/${{ github.workflow_ref }}
        run: |
          cosign sign --yes "$IMAGE@$DIGEST"
          cosign verify "$IMAGE@$DIGEST" --certificate-identity "$IDENTITY" --certificate-oidc-issuer https://token.actions.githubusercontent.com > /dev/null
          echo "signed and verified $IMAGE@$DIGEST"
      - name: GitHub attestation, release files
        id: attest-files
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS
      - name: GitHub attestation, image
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ needs.build.outputs.image }}
          subject-digest: ${{ needs.build.outputs.digest }}
          push-to-registry: true
          create-storage-record: false # linked-artifact records exist only for organization repositories
      - name: SBOM of the image
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ needs.build.outputs.image }}
          subject-digest: ${{ needs.build.outputs.digest }}
          sbom-path: dist/topka-${{ needs.build.outputs.release }}.cyclonedx.json
          push-to-registry: true
          create-storage-record: false
      - name: SBOM of the source archive
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/topka-${{ needs.build.outputs.release }}.tar.gz
          sbom-path: dist/topka-${{ needs.build.outputs.release }}.cyclonedx.json
      - name: Keep the attestation bundle for the release
        env:
          BUNDLE: ${{ steps.attest-files.outputs.bundle-path }}
        run: mkdir bundle && cp "$BUNDLE" "bundle/topka-$RELEASE.provenance.sigstore.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: github-attestation
          path: bundle/
          if-no-files-found: error
          retention-days: 7

  # Verify everything as a user would (docs/release.md, "Verifying a release"), then publish.
  publish:
    needs: [build, provenance-files, provenance-image, attest]
    if: needs.build.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # create the GitHub release
    env:
      RELEASE: ${{ needs.build.outputs.release }}
      IMAGE: ${{ needs.build.outputs.image }}
      DIGEST: ${{ needs.build.outputs.digest }}
      PROVENANCE: ${{ needs.provenance-files.outputs.provenance-name }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.provenance-files.outputs.provenance-name }}
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: github-attestation
          path: dist
      - uses: slsa-framework/slsa-verifier/actions/installer@ea584f4502babc6f60d9bc799dbbb13c1caa9ee6 # v2.7.1
      - name: Verify the SLSA provenance (slsa-verifier)
        run: |
          cd dist
          src="github.com/$GITHUB_REPOSITORY"
          for f in topka-"$RELEASE".tar.gz topka-"$RELEASE".*.json topka-"$RELEASE".image.txt; do
            case "$f" in *.intoto.jsonl|*.sigstore.json) continue ;; esac
            slsa-verifier verify-artifact "$f" --provenance-path "$PROVENANCE" --source-uri "$src" --source-tag "$GITHUB_REF_NAME"
          done
          slsa-verifier verify-image "$IMAGE@$DIGEST" --source-uri "$src" --source-tag "$GITHUB_REF_NAME"
          # The checks must be able to fail: another tag, a changed file.
          if slsa-verifier verify-artifact "topka-$RELEASE.tar.gz" --provenance-path "$PROVENANCE" --source-uri "$src" --source-tag v0.0.0 > /dev/null 2>&1; then echo "::error::a wrong tag verified"; exit 1; fi
          cp "topka-$RELEASE.tar.gz" tampered.tar.gz && echo x >> tampered.tar.gz
          if slsa-verifier verify-artifact tampered.tar.gz --provenance-path "$PROVENANCE" --source-uri "$src" > /dev/null 2>&1; then echo "::error::a changed file verified"; exit 1; fi
          rm tampered.tar.gz
      - name: Verify the GitHub attestations and the signature (gh, cosign)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          for f in topka-"$RELEASE".tar.gz topka-"$RELEASE".*.json topka-"$RELEASE".image.txt; do
            case "$f" in *.intoto.jsonl|*.sigstore.json) continue ;; esac
            gh attestation verify "$f" --repo "$GITHUB_REPOSITORY" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" > /dev/null
          done
          gh attestation verify "oci://$IMAGE@$DIGEST" --repo "$GITHUB_REPOSITORY" > /dev/null
          gh attestation verify "oci://$IMAGE@$DIGEST" --repo "$GITHUB_REPOSITORY" --predicate-type https://cyclonedx.org/bom > /dev/null
          gh attestation verify "topka-$RELEASE.tar.gz" --bundle "topka-$RELEASE.provenance.sigstore.json" --repo "$GITHUB_REPOSITORY" > /dev/null
          echo "verified the files and $IMAGE@$DIGEST"
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
          VERSION: ${{ needs.build.outputs.release }}
        run: |
          cd dist
          mv notes.md "$RUNNER_TEMP/notes.md"
          sha256sum -c SHA256SUMS
          flag=(); [ "$PRERELEASE" = true ] && flag=(--prerelease --latest=false)
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag "${flag[@]}" \
            --title "Topka $VERSION" --notes-file "$RUNNER_TEMP/notes.md" ./*
