# gitleaks for the publication gate (scripts/oss-scan.sh), pinned to a release and its sha256.
name: Install gitleaks
description: Installs the pinned gitleaks release into /usr/local/bin.
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        curl -fsSLo "$RUNNER_TEMP/gitleaks.tgz" https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
        echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tgz" | sha256sum -c -
        tar -xzf "$RUNNER_TEMP/gitleaks.tgz" -C "$RUNNER_TEMP" gitleaks
        sudo install "$RUNNER_TEMP/gitleaks" /usr/local/bin/gitleaks
