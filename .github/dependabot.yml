version: 2
# One maintainer: at most one update PR per ecosystem per month, each grouping everything (majors
# included) so it is reviewed and tested as one change. A major bump in the group still has to pass CI
# and get a read of its changelog before merge; drop it from the PR if it needs real migration work.
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      npm:
        patterns:
          - "*"
        update-types:
          - major
          - minor
          - patch
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      github-actions:
        patterns:
          - "*"
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      docker:
        patterns:
          - "*"
